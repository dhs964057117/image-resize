<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="trc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf4ff"/>
      <stop offset="100%" stop-color="#fae8ff"/>
    </linearGradient>
    <filter id="trc-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.12" flood-color="#581c87"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="20" fill="url(#trc-bg)"/>

  <g filter="url(#trc-shadow)">
    <rect x="70" y="70" width="360" height="360" rx="16" fill="#ffffff" stroke="#f0abfc" stroke-width="2"/>
    
    <!-- Vector Curve Path -->
    <path d="M120 340 C140 180, 220 140, 260 220 C300 300, 360 200, 380 160" fill="none" stroke="#a855f7" stroke-width="4"/>
    
    <!-- Control Points / Anchors -->
    <circle cx="120" cy="340" r="6" fill="#9333ea" stroke="#ffffff" stroke-width="2"/>
    <circle cx="260" cy="220" r="6" fill="#9333ea" stroke="#ffffff" stroke-width="2"/>
    <circle cx="380" cy="160" r="6" fill="#9333ea" stroke="#ffffff" stroke-width="2"/>

    <!-- Tangent handles -->
    <line x1="220" y1="140" x2="300" y2="300" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="4"/>
    <rect x="216" y="136" width="8" height="8" fill="#c084fc"/>
    <rect x="296" y="296" width="8" height="8" fill="#c084fc"/>

    <!-- Center Badge -->
    <rect x="180" y="380" width="140" height="36" rx="8" fill="#3525cd"/>
    <text x="250" y="403" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff" text-anchor="middle">SVG VECTOR</text>
  </g>
</svg>
