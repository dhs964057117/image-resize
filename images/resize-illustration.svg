<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="rsz-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="rsz-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.12" flood-color="#1e1b4b"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="20" fill="url(#rsz-bg)"/>
  
  <!-- Outer Box -->
  <g filter="url(#rsz-shadow)">
    <rect x="70" y="70" width="360" height="360" rx="16" fill="#ffffff" stroke="#c7d2fe" stroke-width="2"/>
    <rect x="110" y="110" width="280" height="280" rx="12" fill="#f8fafc" stroke="#4f46e5" stroke-width="2" stroke-dasharray="6"/>
    <rect x="150" y="150" width="200" height="200" rx="8" fill="#e0e7ff" opacity="0.7"/>

    <!-- Handles -->
    <circle cx="110" cy="110" r="7" fill="#4f46e5" stroke="#ffffff" stroke-width="2"/>
    <circle cx="390" cy="110" r="7" fill="#4f46e5" stroke="#ffffff" stroke-width="2"/>
    <circle cx="110" cy="390" r="7" fill="#4f46e5" stroke="#ffffff" stroke-width="2"/>
    <circle cx="390" cy="390" r="7" fill="#4f46e5" stroke="#ffffff" stroke-width="2"/>

    <!-- Center Badge -->
    <rect x="180" y="225" width="140" height="50" rx="10" fill="#3525cd"/>
    <text x="250" y="246" font-family="sans-serif" font-size="11" font-weight="bold" fill="#c3c0ff" text-anchor="middle">RESOLUTION</text>
    <text x="250" y="264" font-family="sans-serif" font-size="15" font-weight="bold" fill="#ffffff" text-anchor="middle">1920 × 1080</text>
  </g>
</svg>
