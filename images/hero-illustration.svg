<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="hero-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3525cd"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-opacity="0.15" flood-color="#1e1b4b"/>
    </filter>
  </defs>

  <!-- Background decorative shapes -->
  <rect width="600" height="500" rx="24" fill="#f5f3ff"/>
  <circle cx="500" cy="100" r="140" fill="#e0e7ff" opacity="0.6"/>
  <circle cx="100" cy="400" r="120" fill="#ede9fe" opacity="0.8"/>

  <!-- Main Window Card -->
  <g filter="url(#shadow)">
    <rect x="70" y="60" width="460" height="360" rx="16" fill="url(#card-grad)" stroke="#e2e8f0" stroke-width="2"/>
    
    <!-- Window Bar -->
    <rect x="70" y="60" width="460" height="44" rx="16" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="70" y="88" width="460" height="16" fill="#f8fafc"/>
    <circle cx="100" cy="82" r="6" fill="#f87171"/>
    <circle cx="120" cy="82" r="6" fill="#fbbf24"/>
    <circle cx="140" cy="82" r="6" fill="#34d399"/>
    <rect x="200" y="72" width="200" height="20" rx="10" fill="#e2e8f0" opacity="0.7"/>

    <!-- Inner Content: Before / After Split -->
    <rect x="100" y="130" width="400" height="230" rx="12" fill="#312e81"/>
    
    <!-- Landscape Artwork -->
    <path d="M100 280 L220 200 L320 260 L420 180 L500 240 L500 360 L100 360 Z" fill="#4338ca"/>
    <path d="M100 320 L180 270 L290 330 L400 250 L500 310 L500 360 L100 360 Z" fill="#6366f1"/>
    <circle cx="430" cy="170" r="30" fill="#fbbf24"/>
    
    <!-- Grid overlay on right half -->
    <g opacity="0.25">
      <line x1="300" y1="130" x2="300" y2="360" stroke="#ffffff" stroke-width="2" stroke-dasharray="4"/>
      <line x1="350" y1="130" x2="350" y2="360" stroke="#ffffff" stroke-width="1"/>
      <line x1="400" y1="130" x2="400" y2="360" stroke="#ffffff" stroke-width="1"/>
      <line x1="450" y1="130" x2="450" y2="360" stroke="#ffffff" stroke-width="1"/>
      <line x1="300" y1="180" x2="500" y2="180" stroke="#ffffff" stroke-width="1"/>
      <line x1="300" y1="230" x2="500" y2="230" stroke="#ffffff" stroke-width="1"/>
      <line x1="300" y1="280" x2="500" y2="280" stroke="#ffffff" stroke-width="1"/>
    </g>

    <!-- Floating Badge: -85% Compressed -->
    <g filter="url(#shadow)">
      <rect x="340" y="310" width="180" height="56" rx="12" fill="#ffffff" stroke="#e0e7ff" stroke-width="1.5"/>
      <circle cx="370" cy="338" r="16" fill="#10b981"/>
      <path d="M363 338 l5 5 l9 -9" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="396" y="332" font-family="sans-serif" font-size="11" font-weight="bold" fill="#64748b">SIZE REDUCED</text>
      <text x="396" y="352" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">-85% (3.2 MB → 480 KB)</text>
    </g>

    <!-- Floating Badge: 100% Client-Side -->
    <g filter="url(#shadow)">
      <rect x="80" y="110" width="170" height="42" rx="21" fill="#3525cd"/>
      <circle cx="102" cy="131" r="12" fill="#ffffff" opacity="0.2"/>
      <text x="102" y="136" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">⚡</text>
      <text x="122" y="136" font-family="sans-serif" font-size="13" font-weight="600" fill="#ffffff">100% In-Browser</text>
    </g>
  </g>
</svg>
